<body>

<div id="vignette"></div>

    <div class="stat"><span class="lbl">ВЫНОСЛИВОСТЬ</span><div class="track"><i id="stbar"></i></div></div>
  </div>
  <div id="floorbox">ЭТАЖ 1</div>

  <div id="cross"></div>
  <div id="draft"><div class="dhead">СПУСК</div><div class="dtrack"><div id="dfill"></div></div></div>
  <div id="msg"></div>
  <div id="touch-controls" hidden>
    <div id="move-stick" aria-label="Движение"><div id="stick-thumb"></div></div>
    <div class="touch-actions"><button id="touch-sprint" aria-label="Бег">БЕГ</button><button id="touch-interact" aria-label="Взаимодействие">E</button><button id="touch-attack" aria-label="Взмах топором">ТОПОР</button></div>
    <button id="touch-pause" aria-label="Пауза">Ⅱ</button>
  </div>
  <div id="drag-hint" hidden>ПКМ + движение мыши — обзор · ЛКМ — топор · Esc — пауза</div>
  <div id="overlay"><p>Загрузка…</p></div>
</div>
